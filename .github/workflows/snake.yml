name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#512BD4&color_dots=#ebedf0,#d8ccf5,#b39ae8,#7c3aed,#512bd4
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#7C3AED&color_dots=#161b22,#2e1f5e,#4c2fa0,#6d3fd8,#a78bfa

      - uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
